<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>家庭菜单</title>
  <link rel="stylesheet" href="/h5/styles.css?v=ingredient-images">
  <script type="module" src="/h5/app.js?v=ingredient-images"></script>
</head>
<body>
  <header>
    <div class="wrap masthead">
      <a class="brand" href="#today">家庭菜单</a>
      <nav id="main-nav" aria-label="主导航">
        <a href="#today" aria-current="page">今日菜单</a>
        <a href="#stock">食材库存</a>
        <a href="#history">做菜历史</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <section id="today" aria-labelledby="today-title">
      <div class="heading">
        <div><p id="menu-date" class="muted"></p><h1 id="today-title">今天吃什么</h1></div>
        <span class="servings">3 人份</span>
      </div>
      <div id="menu" aria-live="polite">正在读取菜单…</div>
    </section>
    <section id="stock" aria-labelledby="stock-title" hidden>
      <h1 id="stock-title">食材库存</h1>
      <form id="intake">
        <label for="stock-text">一句话录入</label>
        <textarea id="stock-text" required maxlength="500" rows="2" placeholder="例如：番茄很多，买了西兰花，没有牛肉"></textarea>
        <button id="intake-submit" type="submit">
          <span id="intake-label">预览录入</span>
          <span id="intake-loading" hidden><span class="spinner" aria-hidden="true"></span>正在识别库存…</span>
        </button>
      </form>
      <div id="preview-status" class="panel" role="status">
        <span id="preview-loading" hidden><span class="spinner" aria-hidden="true"></span>正在识别库存…</span>
      </div>
      <div id="preview"></div>
      <details id="manual">
        <summary>手动调整库存</summary>
        <form id="manual-form"></form>
      </details>
      <div class="stock-filters">
        <label>搜索食材 <input id="stock-search" type="search" placeholder="输入食材名称"></label>
        <label>库存状态
          <select id="stock-filter">
            <option value="all">全部状态</option>
            <option value="enough">充足</option>
            <option value="low">少量</option>
            <option value="empty">用完</option>
            <option value="unrecorded">未录入</option>
          </select>
        </label>
      </div>
      <p id="stock-count" class="muted" role="status"></p>
      <ul id="inventory" class="stock-list"></ul>
      <p id="stock-empty" class="muted" hidden>没有符合条件的食材。</p>
      <button id="stock-more" type="button" class="secondary" hidden>显示更多食材</button>
    </section>
    <section id="history" aria-labelledby="history-title" hidden>
      <h1 id="history-title">做菜历史</h1>
      <div id="history-list"></div>
      <button id="more-history" type="button" class="secondary" hidden>加载更多</button>
    </section>
    <noscript>请在浏览器中启用 JavaScript。</noscript>
  </main>
</body>
</html>
